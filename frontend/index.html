<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NER Logistics AI - MVP Dashboard</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Leaflet & React-Leaflet -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/react-leaflet@4.2.1/umd/react-leaflet.min.js"></script>
    
    <style>
        body, html, #root { height: 100%; margin: 0; background-color: #f3f4f6; }
        .leaflet-container { height: 100%; width: 100%; border-radius: 0.5rem; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel" data-type="module">
        const { useState, useEffect, useRef } = React;
        const { MapContainer, TileLayer, Polyline, Marker, Popup } = ReactLeaflet;

        const App = () => {
            const [baselineRoute, setBaselineRoute] = useState([]);
            const [predictiveRoute, setPredictiveRoute] = useState([]);
            const [predictiveNodes, setPredictiveNodes] = useState([]); // Needed for spike injection
            
            const [showBaseline, setShowBaseline] = useState(false);
            const [logs, setLogs] = useState([]);
            const [status, setStatus] = useState("Loading...");
            const [etaDelta, setEtaDelta] = useState(0);
            
            const wsRef = useRef(null);

            const addLog = (msg) => {
                const time = new Date().toLocaleTimeString();
                setLogs(prev => [`[${time}] ${msg}`, ...prev]);
            };

            useEffect(() => {
                // Fetch initial route
                fetch('http://127.0.0.1:8000/route')
                    .then(res => res.json())
                    .then(data => {
                        if (data.status === 'wait') {
                            setStatus("WAIT");
                            addLog("Initial state: ALL ROUTES UNSAFE. WAIT.");
                        } else {
                            setStatus("GO");
                            setBaselineRoute(data.baseline_geometry);
                            setPredictiveRoute(data.predictive_geometry);
                            setPredictiveNodes(data.predictive_route);
                            
                            const diff = data.predictive_length_km - data.baseline_length_km;
                            setEtaDelta(diff);
                            
                            addLog(`Initial predictive route loaded (Risk: ${data.predictive_max_risk.toFixed(3)}). Baseline delta: +${diff.toFixed(1)} km`);
                        }
                    })
                    .catch(err => {
                        addLog("Error connecting to backend API.");
                    });

                // Connect to WebSocket for live updates
                wsRef.current = new WebSocket('ws://127.0.0.1:8000/ws');
                wsRef.current.onmessage = (event) => {
                    const data = JSON.parse(event.data);
                    if (data.event === 'route_changed') {
                        addLog(data.reason);
                        if (data.status === 'wait') {
                            setStatus("WAIT");
                            setPredictiveRoute([]);
                        } else {
                            setStatus("GO");
                            setPredictiveRoute(data.new_geometry);
                            // Set new active node sequence
                            setPredictiveNodes(data.new_route);
                            addLog(`Rerouted successfully.`);
                        }
                    }
                };

                return () => {
                    if (wsRef.current) wsRef.current.close();
                };
            }, []);

            const handleSimulateSpike = () => {
                if (predictiveNodes.length < 5) return;
                // Grab an edge roughly in the middle of our current predictive route
                const mid = Math.floor(predictiveNodes.length / 2);
                const u = predictiveNodes[mid];
                const v = predictiveNodes[mid+1];
                
                addLog(`Manually injecting massive rainfall spike on edge ${u}-${v}...`);
                
                fetch('http://127.0.0.1:8000/test_spike', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ u, v })
                })
                .then(res => res.json())
                .then(data => {
                    addLog("Spike injected into backend. Waiting for loop to detect...");
                });
            };

            return (
                <div className="flex h-screen overflow-hidden">
                    {/* Sidebar */}
                    <div className="w-1/3 bg-white shadow-xl z-10 flex flex-col">
                        <div className="p-6 bg-blue-900 text-white">
                            <h1 className="text-2xl font-bold">NER AI Logistics</h1>
                            <p className="text-sm opacity-80 mt-1">NH-10 Corridor Dashboard</p>
                        </div>
                        
                        <div className="p-6 border-b">
                            <div className="flex justify-between items-center mb-4">
                                <span className="font-semibold text-gray-600">Status</span>
                                <span className={`px-4 py-1 rounded-full font-bold ${status === 'GO' ? 'bg-green-100 text-green-700' : 'bg-red-100 text-red-700'}`}>
                                    {status}
                                </span>
                            </div>
                            
                            <div className="flex justify-between items-center mb-6">
                                <span className="font-semibold text-gray-600">Predictive Reroute Penalty</span>
                                <span className="font-bold text-orange-600">+{etaDelta.toFixed(1)} km</span>
                            </div>

                            <button 
                                onClick={handleSimulateSpike}
                                className="w-full bg-red-600 hover:bg-red-700 text-white font-bold py-2 px-4 rounded transition">
                                Simulate Rainfall Spike
                            </button>
                        </div>
                        
                        <div className="p-6 border-b">
                            <label className="flex items-center space-x-3 cursor-pointer">
                                <input 
                                    type="checkbox" 
                                    className="form-checkbox h-5 w-5 text-blue-600"
                                    checked={showBaseline}
                                    onChange={(e) => setShowBaseline(e.target.checked)}
                                />
                                <span className="font-medium text-gray-700">Show Baseline (Naive) Route</span>
                            </label>
                        </div>

                        <div className="flex-1 overflow-y-auto p-4 bg-gray-50">
                            <h3 className="font-bold text-gray-700 mb-2 uppercase text-sm tracking-wider">Live System Logs</h3>
                            <div className="space-y-2 font-mono text-xs">
                                {logs.map((log, i) => (
                                    <div key={i} className="p-2 bg-white rounded border border-gray-200 shadow-sm text-gray-800">
                                        {log}
                                    </div>
                                ))}
                            </div>
                        </div>
                    </div>

                    {/* Map Area */}
                    <div className="w-2/3 p-4">
                        <MapContainer center={[27.1, 88.5]} zoom={11}>
                            <TileLayer
                                url="https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png"
                                attribution="&copy; OpenStreetMap contributors"
                            />
                            
                            {showBaseline && baselineRoute.length > 0 && (
                                <Polyline 
                                    positions={baselineRoute} 
                                    pathOptions={{ color: 'gray', weight: 4, dashArray: '10, 10' }} 
                                />
                            )}
                            
                            {predictiveRoute.length > 0 && (
                                <Polyline 
                                    positions={predictiveRoute} 
                                    pathOptions={{ color: 'blue', weight: 6 }} 
                                />
                            )}
                        </MapContainer>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
