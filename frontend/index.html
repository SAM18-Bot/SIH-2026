<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dispatcher Dashboard - SIH26002</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Leaflet & React-Leaflet -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/react-leaflet@4.2.1/umd/react-leaflet.min.js"></script>
    
    <style>
        body, html, #root { height: 100%; margin: 0; background-color: #f3f4f6; }
        .leaflet-container { height: 100%; width: 100%; border-radius: 0.5rem; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel" data-type="module">
        const { useState, useEffect, useRef } = React;
        const { MapContainer, TileLayer, Polyline, Marker, Popup } = ReactLeaflet;

        const App = () => {
            const [shipments, setShipments] = useState([]);
            const [logs, setLogs] = useState([]);
            const wsRef = useRef(null);

            const addLog = (msg) => {
                const time = new Date().toLocaleTimeString();
                setLogs(prev => [`[${time}] ${msg}`, ...prev].slice(0, 50));
            };

            const fetchShipments = () => {
                fetch('http://127.0.0.1:8000/api/shipments/')
                    .then(res => res.json())
                    .then(data => setShipments(data))
                    .catch(err => addLog("Error connecting to API. Is the backend running?"));
            };

            useEffect(() => {
                fetchShipments();

                wsRef.current = new WebSocket('ws://127.0.0.1:8000/ws');
                wsRef.current.onmessage = (event) => {
                    const data = JSON.parse(event.data);
                    if (data.event === 'shipment_updated') {
                        addLog(`Shipment #${data.shipment_id} Update: ${data.reason}`);
                        fetchShipments(); // Refresh list to get new routes
                    }
                };

                return () => {
                    if (wsRef.current) wsRef.current.close();
                };
            }, []);

            const handleCreateShipment = () => {
                // Hardcoded Sevoke to Gangtok for MVP
                const payload = {
                    origin_lat: 26.8797,
                    origin_lon: 88.4708,
                    dest_lat: 27.3290,
                    dest_lon: 88.6122,
                    cargo_type: "Medical Supplies",
                    priority: "HIGH",
                    departure_window_start: new Date().toISOString(),
                    departure_window_end: new Date(Date.now() + 8*3600*1000).toISOString()
                };

                fetch('http://127.0.0.1:8000/api/shipments/', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                })
                .then(res => res.json())
                .then(data => {
                    addLog(`Created Shipment Request #${data.id}`);
                    fetchShipments();
                });
            };

            const handleReportBlockage = () => {
                // Block a segment near Rangpo
                const payload = {
                    lat: 27.174,
                    lon: 88.530,
                    description: "Landslide blocking NH-10 near Rangpo"
                };

                fetch('http://127.0.0.1:8000/api/reports/', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                })
                .then(res => res.json())
                .then(data => {
                    addLog(data.message);
                });
            };

            return (
                <div className="flex h-screen overflow-hidden">
                    {/* Sidebar */}
                    <div className="w-1/3 bg-white shadow-xl z-10 flex flex-col">
                        <div className="p-6 bg-blue-900 text-white">
                            <h1 className="text-2xl font-bold">Dispatcher Terminal</h1>
                            <p className="text-sm opacity-80 mt-1">SIH26002 - NER Logistics Platform</p>
                        </div>
                        
                        <div className="p-4 border-b space-y-3 bg-gray-50">
                            <button 
                                onClick={handleCreateShipment}
                                className="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-2 px-4 rounded shadow transition">
                                + New Shipment Request (Sevoke → Gangtok)
                            </button>
                            
                            <button 
                                onClick={handleReportBlockage}
                                className="w-full bg-red-600 hover:bg-red-700 text-white font-bold py-2 px-4 rounded shadow transition">
                                ⚠️ Simulate Field Report (Blockage at Rangpo)
                            </button>
                        </div>

                        <div className="flex-1 overflow-y-auto p-4 border-b">
                            <h3 className="font-bold text-gray-700 mb-2 uppercase text-sm tracking-wider">Active Shipments</h3>
                            {shipments.length === 0 && <p className="text-sm text-gray-500">No active shipments in system.</p>}
                            <div className="space-y-3">
                                {shipments.map(s => (
                                    <div key={s.id} className="p-3 bg-white rounded border border-gray-200 shadow-sm text-sm">
                                        <div className="flex justify-between font-bold text-gray-800">
                                            <span>#{s.id} - {s.cargo_type}</span>
                                            <span className={`px-2 py-1 text-xs rounded ${s.status === 'ACTIVE' ? 'bg-green-100 text-green-700' : s.status === 'DELAYED' ? 'bg-orange-100 text-orange-700' : 'bg-gray-100 text-gray-700'}`}>
                                                {s.status}
                                            </span>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>

                        <div className="h-1/3 overflow-y-auto p-4 bg-gray-900 text-green-400 border-t">
                            <h3 className="font-bold text-white mb-2 uppercase text-sm tracking-wider">System Event Log</h3>
                            <div className="space-y-1 font-mono text-xs">
                                {logs.map((log, i) => (
                                    <div key={i} className="break-words">{log}</div>
                                ))}
                            </div>
                        </div>
                    </div>

                    {/* Map Area */}
                    <div className="w-2/3 p-4">
                        <MapContainer center={[27.1, 88.5]} zoom={11}>
                            <TileLayer url="https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png" />
                            {shipments.filter(s => s.status === 'ACTIVE' || s.status === 'DELAYED').map(s => {
                                const route = s.current_route_json ? JSON.parse(s.current_route_json) : [];
                                if(route.length === 0) return null;
                                return (
                                    <Polyline 
                                        key={s.id}
                                        positions={route} 
                                        pathOptions={{ color: s.status === 'ACTIVE' ? 'blue' : 'orange', weight: 5 }} 
                                    />
                                );
                            })}
                        </MapContainer>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
